    https://github.com/SWFSC/esdglider
  sea_name: North Pacific Ocean
  source: Observational data from a profiling glider
  standard_name_vocabulary: CF Standard Name Table v72
  summary: 'These data are part of the NOAA Fisheries 2026 Underwater Glider Challenge. This was a two-week field trial off the coast of Hawaii to evaluate gliders equipped with passive acoustic monitoring (PAM) and assess how these platforms can be used to augment ship-based marine mammal surveys. This glider was equipped with a JASCO OceanObserver recording system and a RBR CTD (flow through).'
  transmission_system: IRIDIUM
  wmo_id: ' '
  

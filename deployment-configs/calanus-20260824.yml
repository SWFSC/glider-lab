  standard_name_vocabulary: CF Standard Name Table v72
  summary: "This glider was deployed as the first of several month long deployments\
    \ as part of a targeted sampling program to monitor the evolution and ecosystem\
    \ impacts of a predicted \"very strong\" El Ni\xF1o. It was deployed along CalCOFI\
    \ Line 93 starting in late August, and future deployments will continue through\
    \ spring 2027. The glider continuously sampled a line transect out to approximately\
    \ 100 km and to depths of 500 meters. Science sensors included a shadowgraph for\
    \ high-resolution plankton imaging, a CTD, an optical sensor (ECO Puck) for chlorophyll,\
    \ backscatter, and colored dissolved organic matter measurements, and an oxygen\
    \ sensor. Data from this deployment will be used to fill spatial and temporal\
    \ gaps between scheduled ship surveys, assess how marine heatwaves modify El Ni\xF1\
    o impacts, verify ocean models, and inform dynamic ocean management frameworks."
  transmission_system: IRIDIUM
